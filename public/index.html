<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <script src="main.js"></script>
    </head>
    <body>
        <h1 x-data="{ message: 'I ❤️ Alpine' }" x-text="message"></h1>
        <div x-data="torrentManager()">
            <button @click="loadTorrents" :disabled="isLoading">
                <span
                    x-text="isLoading ? 'Loading...' : 'Load Torrents'"
                ></span>
            </button>

            <!-- Loop through the torrents array and display them -->
            <template x-for="torrent in torrents" :key="torrent.id">
                <div>
                    <strong x-text="torrent.filename"></strong>
                    <span x-text="torrent.status"></span>
                </div>
            </template>
        </div>
    </body>
</html>
